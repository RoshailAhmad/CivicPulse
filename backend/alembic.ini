[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL comes from DATABASE_URL (see alembic/env.py), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
