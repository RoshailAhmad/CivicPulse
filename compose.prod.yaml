# PRODUCTION-style stack: runs pre-built, tested images from GHCR by an
# immutable tag (the git commit SHA). No build:, no bind mounts, and no
# published ports on the database or cache.
#   IMAGE_TAG=<commit-sha> docker compose -f compose.prod.yaml up -d
name: civicpulse-prod

x-backend-env: &backend-env
  APP_ENV: prod
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
  REDIS_URL: redis://cache:6379/0
  TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-rules}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}

services:
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/roshailahmad}/civicpulse-frontend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "80:8080"
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/roshailahmad}/civicpulse-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    environment: *backend-env
    networks: [edge, internal]
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/roshailahmad}/civicpulse-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    networks: [internal]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  cache:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
