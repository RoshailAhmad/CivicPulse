apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # % of the pod's CPU *request* (backend.yaml)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # scale down slowly: flapping is expensive
    scaleUp:
      stabilizationWindowSeconds: 0     # scale up immediately: users are waiting
