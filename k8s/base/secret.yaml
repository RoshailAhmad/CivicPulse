# PLACEHOLDERS ONLY. Never put a real password or API key in this file:
# base64 is encoding, not encryption, and Git remembers forever.
# Real values are created on the cluster from GitHub Secrets (see cd.yml),
# and the prod overlay removes this object so it can't overwrite them.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
type: Opaque
stringData:
  POSTGRES_USER: civicpulse
  POSTGRES_PASSWORD: change-me
  LLM_API_KEY: ""
