# One host, two routes: /api -> backend, everything else -> frontend.
# Uses the cluster's default ingress controller (Traefik on k3d).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
