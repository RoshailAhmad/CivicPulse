apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # start one new pod before removing an old one
      maxUnavailable: 0   # never drop below the desired count during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      # preStop (5 s) + uvicorn's graceful drain (20 s) must fit inside this.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Migrations + idempotent seed before the app starts. Advisory locks
        # (alembic/env.py, repositories/complaints.py) make parallel pods take turns.
        - name: migrate
          image: civicpulse-backend
          command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@database:5432/$(POSTGRES_DB)
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: backend
          image: civicpulse-backend
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@database:5432/$(POSTGRES_DB)
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: LLM_API_KEY, optional: true }
          # Without requests, the HPA has no denominator and shows <unknown>/60%.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          # Slow start is not failure: up to 30 x 2 s = 60 s to boot before
          # liveness is allowed to restart anything.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          # Liveness RESTARTS the pod, so it must NOT depend on the database.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness REMOVES the pod from the Service, so it SHOULD check the database.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving for 5 s while the pod is removed from the Service
              # endpoints, so no new request is routed to a pod that is stopping.
              exec: { command: ["sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
