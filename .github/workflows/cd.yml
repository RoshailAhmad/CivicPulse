name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false   # never abort a deploy half-way

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests on the merged result
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest --cov=app --cov-fail-under=65
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests on the merged result
        working-directory: frontend
        run: |
          npm ci
          npm test

  build-push:
    needs: test   # never publish images built from code we know is broken
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to GHCR with the built-in, scoped GITHUB_TOKEN
    outputs:
      image-tag: ${{ github.sha }}
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Registry owner must be lower-case for GHCR
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/civicpulse-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/civicpulse-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/civicpulse-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/civicpulse-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: SBOM for backend (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.OWNER }}/civicpulse-backend:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-backend.spdx.json
      - name: SBOM for frontend (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.OWNER }}/civicpulse-frontend:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-frontend.spdx.json
      - name: Record what was published
        run: |
          {
            echo "### Published images"
            echo "- backend: \`ghcr.io/$OWNER/civicpulse-backend:${{ github.sha }}\` (${{ steps.backend.outputs.digest }})"
            echo "- frontend: \`ghcr.io/$OWNER/civicpulse-frontend:${{ github.sha }}\` (${{ steps.frontend.outputs.digest }})"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    needs: build-push   # deploy only what was just tested and published
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Install k3d and kustomize (pinned)
        run: |
          curl -sSL -o k3d https://github.com/k3d-io/k3d/releases/download/v5.7.5/k3d-linux-amd64
          chmod +x k3d && sudo mv k3d /usr/local/bin/
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: Create an ephemeral k3d cluster (Traefik ingress + metrics-server built in)
        run: k3d cluster create civicpulse --agents 1 -p "8081:80@loadbalancer" --wait --timeout 180s
      - name: Install the VPA CRD (so the VerticalPodAutoscaler object is accepted)
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.2.1/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the exact images built from this commit into the cluster
        run: |
          for app in backend frontend; do
            docker pull "ghcr.io/$OWNER/civicpulse-$app:$IMAGE_TAG"
            k3d image import -c civicpulse "ghcr.io/$OWNER/civicpulse-$app:$IMAGE_TAG"
          done
      - name: Create the Secret from GitHub Secrets (never from a file in Git)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          pg_password="${POSTGRES_PASSWORD:-$(openssl rand -hex 16)}"
          echo "::add-mask::$pg_password"
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n civicpulse create secret generic civicpulse-secrets \
            --from-literal=POSTGRES_USER=civicpulse \
            --from-literal=POSTGRES_PASSWORD="$pg_password" \
            --from-literal=LLM_API_KEY="${LLM_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy by immutable reference (commit SHA, never :latest)
        run: |
          (cd k8s/overlays/prod && kustomize edit set image \
            "civicpulse-backend=ghcr.io/$OWNER/civicpulse-backend:$IMAGE_TAG" \
            "civicpulse-frontend=ghcr.io/$OWNER/civicpulse-frontend:$IMAGE_TAG")
          kustomize build k8s/overlays/prod | kubectl apply -f -
      - name: Wait for the rollout
        run: |
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=180s
          kubectl -n civicpulse rollout status deployment/redis --timeout=120s
          kubectl -n civicpulse rollout status deployment/backend --timeout=300s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s
      - name: Smoke test through the Ingress
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8081/api/stats >/dev/null && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8081/ | grep -q CivicPulse
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/complaints \
            -H 'Content-Type: application/json' \
            -d '{"text":"Streetlight not working on lane 4 for a week","location":"Chaklala Scheme 2"}')
          test "$code" = "201"
          echo "Smoke test passed: UI served, API answered, complaint created"
      - name: What is running
        run: |
          kubectl -n civicpulse get pods,svc,ingress,pvc -o wide
          kubectl -n civicpulse get hpa
          echo "backend image: $(kubectl -n civicpulse get deploy backend -o jsonpath='{.spec.template.spec.containers[0].image}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse get events --sort-by=.lastTimestamp | tail -40
          kubectl -n civicpulse describe pods | tail -120
          kubectl -n civicpulse logs deploy/backend --all-containers --tail=100 || true
