name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

# Least privilege: CI only needs to read the code. Nothing here can publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend tools
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: ruff (lint + format)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        working-directory: backend
        run: mypy app
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck
      - name: Typed API client matches the backend OpenAPI schema
        run: |
          (cd backend && python -m app.export_openapi)
          (cd frontend && npm run gen:api)
          git diff --exit-code -- backend/openapi.json frontend/src/api/schema.ts \
            || { echo "::error::API client is stale. Run export_openapi + npm run gen:api and commit."; exit 1; }

  test-backend:
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated   # deterministic: no network, same answer every run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest with coverage gate (>= 65% of app/)
        working-directory: backend
        run: pytest --cov=app --cov-report=xml --cov-fail-under=65
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Vitest component tests
        working-directory: frontend
        run: npm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (NOT pushed - a PR must not publish anything)
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: civicpulse-backend:ci
          load: true
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image (NOT pushed)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: civicpulse-frontend:ci
          load: true
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Report image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep civicpulse | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hand the images to the scan job
        run: docker save civicpulse-backend:ci civicpulse-frontend:ci -o images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: docker load -i images.tar
      - name: Trivy - fail on HIGH/CRITICAL that have a fixed version
        run: |
          for image in civicpulse-backend:ci civicpulse-frontend:ci; do
            echo "::group::Trivy $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/work" -w /work \
              aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore \
              --exit-code 1 --no-progress "$image"
            echo "::endgroup::"
          done

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform (pinned)
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Validate rendered manifests (catches a broken manifest in seconds)
        run: |
          for overlay in prod dev; do
            echo "::group::overlays/$overlay"
            ./kustomize build "k8s/overlays/$overlay" | ./kubeconform -strict -summary \
              -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  integration:
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for backend readiness (Postgres + Redis reachable)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/ready && exit 0
            sleep 3
          done
          exit 1
      - name: Wait for the frontend
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          exit 1
      - name: Real request path through nginx -> backend -> Postgres/Redis
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api
          body='{"text":"Burst water main flooding Street 12 since fajr, water entering homes","location":"Street 12, G-9/2"}'
          id=$(curl -fsS -X POST "$API/complaints" -H 'Content-Type: application/json' -d "$body" | jq -r .id)
          category=$(curl -fsS "$API/complaints/$id" | jq -r .category)
          echo "created $id with category $category"
          test "$category" = "water"
          cache_header() { curl -fsS -o /dev/null -D - "$API/stats" | grep -i '^x-cache:' | awk '{print $2}' | tr -d '\r'; }
          first=$(cache_header); second=$(cache_header)
          echo "X-Cache: $first then $second"
          test "$first" = "MISS"
          test "$second" = "HIT"
      - name: Frontend must NOT reach the database (network segmentation)
        run: |
          if docker compose exec -T frontend ping -c 1 -W 2 database; then
            echo "::error::frontend reached the database - segmentation is broken"; exit 1
          fi
          echo "OK: frontend has no route to the database"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
